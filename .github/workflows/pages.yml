name: Publish Nurullah 100 Gun
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate all topics and lesson resources
        run: node tests/validate.mjs
      - name: Audit academic workload and topic chronology
        run: node tests/academic-audit.mjs
      - name: Set up Node.js for browser tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright test runner
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile browsers
        run: npm run test:e2e
      - name: Build minimal static application
        run: |
          mkdir -p public
          cp index.html styles.css gothic.css gothic-scene.svg icon.svg manifest.webmanifest curriculum.js plan.js resources.js app.js sw.js taslak.html public/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
